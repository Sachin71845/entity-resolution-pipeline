# ==============================================================================
# Multi-Source Entity Resolution Pipeline Configuration
# Defines source schemas, format specifications, field mappings, and normalization rules.
# Adding a new source requires updating this configuration without modifying the ingestion engine.
# ==============================================================================

version: "2.0"

# Target canonical schema mapping definition
canonical_schema:
  attributes:
    source_system: { type: "string", required: true }
    source_id: { type: "string", required: true }
    full_name: { type: "string", required: false }
    email: { type: "string", required: false }
    phone: { type: "string", required: false }
    source_updated_at: { type: "datetime", required: false }

# Active source systems participating in entity resolution
sources:
  CRM:
    description: "Customer Relationship Management System"
    file_format: "csv"
    file_path: "data/input/crm_customers.csv"
    encoding: "utf-8-sig"
    primary_key: "customer_id"
    id_pattern: "^CUST-\\d{5}$"
    field_mappings:
      customer_id: "source_id"
      full_name: "full_name"
      email_address: "email"
      phone_number: "phone"
      created_at: "source_updated_at"
    required_fields:
      - "customer_id"
    normalization_rules:
      email:
        - "strip"
        - "lowercase"
      name:
        - "strip"
        - "collapse_whitespace"
        - "title_case"
      phone:
        - "strip_non_digits"
        - "normalize_10digit"

  BILLING:
    description: "Cloud & Subscription Billing Engine"
    file_format: "json"
    file_path: "data/input/billing_accounts.json"
    encoding: "utf-8"
    primary_key: "account_id"
    id_pattern: "^b_\\d{3,}$"
    records_json_path: "accounts"
    field_mappings:
      account_id: "source_id"
      contact_name: "full_name"
      billing_email: "email"
      contact_phone: "phone"
      last_invoice_date: "source_updated_at"
    required_fields:
      - "account_id"
    normalization_rules:
      email:
        - "strip"
        - "lowercase"
      name:
        - "strip"
        - "collapse_whitespace"
        - "title_case"
      phone:
        - "strip_non_digits"
        - "normalize_10digit"

  ERP:
    description: "Enterprise Resource Planning Client Registry"
    file_format: "csv"
    file_path: "data/input/erp_clients.csv"
    encoding: "utf-8-sig"
    primary_key: "client_code"
    id_pattern: "^\\d{5}$"
    field_mappings:
      client_code: "source_id"
      company_or_person_name: "full_name"
      primary_email: "email"
      telephone: "phone"
      updated_timestamp: "source_updated_at"
    required_fields:
      - "client_code"
    normalization_rules:
      email:
        - "strip"
        - "lowercase"
      name:
        - "strip"
        - "collapse_whitespace"
        - "title_case"
      phone:
        - "strip_non_digits"
        - "normalize_10digit"

# Resolution and matching strategy configuration
matching_rules:
  exact_email:
    enabled: true
    priority: 1
    match_type: "EXACT_EMAIL"
    confidence_score: 100.0

  exact_email_after_normalization:
    enabled: true
    priority: 2
    match_type: "EXACT_EMAIL_NORMALIZED"
    confidence_score: 98.0

  rule_name_phone:
    enabled: true
    priority: 3
    match_type: "RULE_NAME_PHONE"
    confidence_score: 90.0

  conflict_detection:
    enabled: true
    detect_email_collisions: true
    quarantine_ambiguous_matches: true

canonical_id_generation:
  prefix: "CAN-"
  # Strategy options: "deterministic_anchor_hash", "sequential"
  strategy: "deterministic_anchor_hash"

